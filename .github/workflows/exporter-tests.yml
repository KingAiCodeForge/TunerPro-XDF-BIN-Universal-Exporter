name: Exporter package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        shell: pwsh
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install build pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -Path dist -Filter 'kingai_tunerpro_xdf-*.whl' -File)
          if ($wheels.Count -ne 1) { throw "Expected one built wheel; found $($wheels.Count)" }
          python -m pip install --no-index $wheels[0].FullName
          exit $LASTEXITCODE
      - name: Test installed package away from source
        shell: pwsh
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'exporter-tests'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          # Keep core runtime imports bound to the installed wheel. Source-only
          # collection tools and the GUI worker are tested alongside it.
          Get-ChildItem -File -Filter '*.py' |
            Where-Object { $_.Name -notin @('tunerpro_exporter.py', 'bmw_0pa_0da_to_bin.py', 'tunerpro_native_export_parity.py') } |
            Copy-Item -Destination $testRoot
          Copy-Item -Path *.bat -Destination $testRoot
          Set-Location $testRoot
          python -I -m pytest --import-mode=importlib -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tunerpro-xdf-export --help
          exit $LASTEXITCODE
